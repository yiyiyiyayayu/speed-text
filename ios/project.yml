name: NodeScope
options:
  bundleIdPrefix: app.nodescope
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
    ENABLE_BITCODE: NO
    ENABLE_DEBUG_DYLIB: NO
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  NodeScope:
    type: application
    platform: iOS
    sources:
      - path: NodeScope
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nodescope.speedtest
        SWIFT_OBJC_BRIDGING_HEADER: NodeScope/NodeScope-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LIBRARY_SEARCH_PATHS: ['$(inherited)', '$(PROJECT_DIR)/Frameworks']
        OTHER_LDFLAGS: ['$(inherited)', '-lresolv', '-framework', 'Security', '-framework', 'CoreFoundation']
    dependencies:
      - framework: Frameworks/libNodeCore.a
        embed: false
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: 节点测速
        CFBundleShortVersionString: '1.0.0'
        CFBundleVersion: '1'
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: 用于测试您导入的局域网代理节点。
schemes:
  NodeScope:
    build:
      targets:
        NodeScope: all
    run:
      config: Debug
    archive:
      config: Release
