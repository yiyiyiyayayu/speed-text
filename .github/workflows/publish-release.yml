name: Publish verified IPA

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build iOS IPA run ID
        required: true
        default: '38999525204'
      tag:
        description: Release tag
        required: true
        default: v1.0.0

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Check successful source build
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > build-run.json
          python3 - <<'PY'
          import json, os
          run=json.load(open('build-run.json'))
          assert run['conclusion']=='success', 'Source build must pass'
          assert run['name']=='Build iOS IPA', 'Unexpected source workflow'
          assert run['repository']['full_name']==os.environ['GH_REPO']
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('RELEASE_SOURCE_SHA='+run['head_sha']+'\n')
          PY
      - name: Download verified artifact
        run: |
          gh run download "$BUILD_RUN_ID" --name NodeScope-unsigned-IPA --dir dist
          cd dist
          sha256sum -c SHA256SUMS.txt
      - name: Publish IPA and notices
        run: |
          gh release create "$RELEASE_TAG" dist/NodeScope-unsigned.ipa dist/SHA256SUMS.txt dist/THIRD_PARTY_NOTICES.txt --target "$RELEASE_SOURCE_SHA" --title "NodeScope ${RELEASE_TAG#v} · 节点测速" --notes-file docs/RELEASE_v1.0.0.md
