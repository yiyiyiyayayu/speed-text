name: Build iOS IPA

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - name: Select Xcode with iOS 26 SDK
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
          cache-dependency-path: core/go.sum
      - run: go test -race ./... && go vet ./...
        working-directory: core

  ios-tests:
    name: iOS policy and UI tests
    uses: ./.github/workflows/ui-smoke.yml

  build:
    name: Unsigned IPA for ESign
    needs: core-tests
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Select Xcode with iOS 26 SDK
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
          cache-dependency-path: core/go.sum
      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Show toolchain
        run: |
          xcodebuild -version
          go version
      - name: Build device app and package IPA
        run: bash scripts/build-ipa.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NodeScope-unsigned-IPA
          path: dist/*
          if-no-files-found: error
          retention-days: 30
